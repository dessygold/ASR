              "editorMode": "code",
              "exemplar": false,
              "expr": "max by (namespace, pod) (\r\n  # Priority 1: JVM-level Uptime (Jira, Confluence)\r\n  (\r\n    {__name__=~\"(jvm_vm_uptime|java_lang_Runtime_Uptime)\", namespace=~\"$namespace\", pod=~\"$pod|\"} / 1000\r\n  )\r\n  or\r\n  # Priority 2: Process-level Uptime (Keycloak, Nexus)\r\n  (\r\n    {__name__=\"process_uptime_seconds\", namespace=~\"$namespace\", pod=~\"$pod|\"}\r\n  )\r\n  or\r\n  # Priority 3: Kubernetes Container-level Uptime (Draw.io / Fallback)\r\n  # (Multiplied by 'Running' phase to filter out dead or restarted pods!)\r\n  (\r\n    (time() - kube_pod_start_time{namespace=~\"$namespace\", pod=~\"$pod|\"})\r\n    * on(namespace, pod)\r\n    kube_pod_status_phase{phase=\"Running\", namespace=~\"$namespace\", pod=~\"$pod|\"}\r\n  )\r\n) default 0\r\n",
              "format": "time_series",
              "instant": true,
              "interval": "",
              "legendFormat": "{{pod}} Start Time",
              "range": false,
              "refId": "A"
